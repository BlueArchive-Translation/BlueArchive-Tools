name: Update

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart]

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: true

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        server: [JP, JPPC, GL, CN]

    runs-on: ubuntu-latest

    env:
      PYTHONUTF8: 1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.server == 'JPPC'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install asar tool
        if: matrix.server == 'JPPC'
        run: npm install -g @electron/asar

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Login
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Install requirements
        run: |
          pip install -r requirements.txt
          sudo apt install -y android-sdk-build-tools

      - name: 运行更新
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        shell: bash
        run: |
          python update.py ${{ matrix.server }}

      - name: 重新运行
        env:
          GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}
        shell: bash
        run: |
          echo "触发下一轮 Update..."

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.UPDATE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "restart"}'

          echo "下一轮 Update 已触发。"

          echo "终止当前 Workflow..."

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token ${{ secrets.UPDATE_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel

          echo "取消请求已发送。"

