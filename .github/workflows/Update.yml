name: 更新

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart]

permissions:
  contents: write
  actions: write

concurrency:
  group: update
  cancel-in-progress: true

env:
  PYTHONUTF8: 1
  PYTHONUNBUFFERED: "1"
  CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
  EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
  EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
  TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
  GH_TOKEN: ${{ secrets.UPDATE_TOKEN }}

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        server: [JP, JPPC, GL, CN]

    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: 设置 Node.js
        if: matrix.server == 'JPPC'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 asar 工具
        if: matrix.server == 'JPPC'
        run: npm install -g @electron/asar

      - name: 安装 SSH 密钥
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: 配置 Git 登录信息
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          sudo apt install -y android-sdk-build-tools

      - name: 运行更新
        shell: bash
        run: |
          python update.py ${{ matrix.server }}

      - name: 重新运行
        shell: bash
        run: |
          echo "正在触发下一轮更新..."

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type": "restart"}'

          echo "下一轮更新已触发。"

          echo "正在终止当前工作流..."

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: token $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "取消请求已发送。"
