name: 提取并上传 JP Spine

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-spine
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
  YostarToken: ${{ secrets.YostarToken }}
  SPINE_WORKERS: "4"
  SPINE_DOWNLOAD_WORKERS: "4"
  SPINE_UPLOAD_WORKERS: "3"

jobs:
  spine:
    name: JP - ${{ matrix.category }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        category:
          - spinecharacters
          - spinelobbies
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 设置 .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 SSH 密钥
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 并发提取并上传 JP Spine
        run: python -m extract.extract_spine "${{ matrix.category }}"
